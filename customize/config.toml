# Your LG TV customisation profile.
# Edit the values, then run:  python3 tv_customize.py apply
# Delete or comment out (#) any line you don't want changed.

[tv]
ip = "192.168.1.50"          # TV: Settings > General > Network > (Wi-Fi) > Advanced

[picture]
# Picture mode. Common values: vivid, normal (Standard), eco, cinema,
# sports, game, filmMaker, expert1, expert2.
pictureMode = "cinema"
backlight = 80               # 0-100 ("OLED Pixel Brightness" on OLEDs)
contrast = 85                # 0-100
brightness = 50              # 0-100
color = 55                   # 0-100
sharpness = 10               # 0-50
energySaving = "off"         # off, auto, min, med, max

[sound]
output = "tv_speaker"        # tv_speaker, external_arc, bt_soundbar, headphone
volume = 15                  # 0-100

# Rename HDMI inputs and give them icons on the home screen.
# Icons: satellite, settopbox, dvd, bluray, hometheater, gameconsole,
#        streamingbox, camera, mobile, pc
[[inputs]]
id = "HDMI_1"
label = "Set-Top Box"
icon = "settopbox"

[[inputs]]
id = "HDMI_2"
label = "Game Console"
icon = "gameconsole"

[startup]
# App to open after applying (run "python3 tv_customize.py apps" for IDs).
# e.g. "youtube.leanback.v4", "netflix", "amazon", "com.webos.app.hdmi1"
launch_app = ""
message = "Your TV settings have been applied"

# Clean home screen app: clock, Inputs / Wi-Fi / Settings buttons and a 4x4
# grid with only your installed apps (scrolls if you have more than 16).
# Build and install it with:  python3 tv_customize.py home
# (needs Developer Mode, see ../youtube/install-youtube-adfree.sh steps 1-3)
[home]
background = "#0b0b0d"       # solid background colour
background_glow = "#3a0d10"  # soft glow behind the clock; "" for pure solid
text_color = "#ffffff"
accent = "#ffffff"           # outline on the selected app / button
clock_24h = false            # false = 4:49 PM, true = 16:49
show_greeting = true         # "GOOD AFTERNOON" above the clock
include_system_apps = false  # true = also show LG's built-in apps
# Built-in items to add to the dock even when include_system_apps = false
# (run "python3 tv_customize.py apps" to see every ID), e.g. "com.webos.app.hdmi1"
always_show = []
hide = []                    # app IDs to leave out
order = ["youtube.leanback.v4", "netflix", "amazon"]   # these come first

# Each app card uses the colour of the app's own icon. To change one,
# give its name or ID a colour here:
[home.colors]
# "YouTube" = "#ff0000"
# "My App"  = "#ff7a18, #af002d"
